server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Docker's embedded DNS, resolved on every request rather than once at
    # startup.
    #
    # Without this, nginx resolves "api" when it boots and caches the
    # address forever. Recreating the api container then gives it a new ip
    # and every proxied request fails with a 502 until nginx is restarted —
    # which is exactly the failure this fixes.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Hashed assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # REST API -> Hono
    location /api/ {
        set $api_upstream http://api:3001;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # WebSocket fan-out -> Hono
    location /ws {
        set $ws_upstream http://api:3001;
        proxy_pass $ws_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Mailcore: OAuth callback, tracking pixel, click redirect, unsubscribe.
    # These must be reachable from the public internet (tracking images are
    # loaded by the recipient's mail client), so proxy instead of SPA fallback.
    location /oauth/ {
        set $mc_upstream http://mailcore:3004;
        proxy_pass $mc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /t/ {
        set $mc_upstream http://mailcore:3004;
        proxy_pass $mc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /u/ {
        set $mc_upstream http://mailcore:3004;
        proxy_pass $mc_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback: every unknown path serves index.html so React Router works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't cache the entry document.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
