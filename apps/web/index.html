<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--google-site-verification-->
    <title>Mail Burstly</title>
    <meta
      name="description"
      content="Mail Burstly is an email outreach manager: connect your own Gmail or Outlook mailbox, send multi-step cold email campaigns from your own address, and work every reply in one inbox."
    />
    <script>
      // Apply the stored theme before first paint so there is no flash of the
      // wrong palette. Defaults to dark.
      (function () {
        try {
          var stored = localStorage.getItem("mailrung.theme");
          var dark = stored ? stored === "dark" : true;
          document.documentElement.classList.toggle("dark", dark);
          document.documentElement.style.colorScheme = dark ? "dark" : "light";
        } catch (e) {
          /* localStorage unavailable — keep the dark default from the class */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
